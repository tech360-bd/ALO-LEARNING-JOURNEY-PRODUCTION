name: CI

# Verified-PR gate: every pull request into main must pass this workflow, and
# deploy.yml runs it as its `verify` job (workflow_call) before any production
# step. The toolchain matches production: Node 22 + npm, with package-lock.json
# as the canonical lockfile (scripts/deploy-production.sh and cPanel both run
# `npm ci`). bun.lock is kept for local Bun users only and is not used here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# When deploy.yml calls this workflow it runs in the caller's context, so the
# group must include the workflow name; otherwise the push-triggered CI run and
# deploy's `verify` job would cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Explicitly identify this as CI so disposable-database guards don't rely
      # on runner-specific defaults. DATABASE_URL is isolated and throwaway.
      CI: 'true'
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Record candidate version (not a release tag)
        run: |
          printf 'Candidate: %s · SHA: %s · Node: %s · npm: %s\n' \
            "$(node -p 'require("./package.json").version')" "$GITHUB_SHA" "$(node -v)" "$(npm -v)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma and generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Verify the checked-in migration contract
        run: npm run verify:migrations

      - name: Apply migrations twice to isolated MySQL and verify tables/columns
        run: |
          # Print each command's output; on failure also publish its last lines as
          # an error annotation so the database error is visible on the PR itself.
          check() {
            local title="$1"; shift
            local code=0 out
            out=$("$@" 2>&1) || code=$?
            printf '%s\n' "$out"
            if [ "$code" -ne 0 ]; then
              echo "::error title=${title}::$(printf '%s\n' "$out" | grep -v '^[[:space:]]*$' | tail -n 40 | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); print }')"
              exit "$code"
            fi
          }
          check "prisma migrate deploy (first run)" npx prisma migrate deploy
          check "prisma migrate deploy (re-run must be a no-op)" npx prisma migrate deploy
          check "prisma migrate status" npx prisma migrate status
          check "migration integration test" npm run test:migrations:integration
          MYSQL_ADMIN_URL="mysql://root:ci-root@127.0.0.1:3306/ci" check "isolated backup and restore verification" npm run test:backup-restore

      - name: Schema drift check (migrations must reproduce prisma/schema.prisma)
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root -e "CREATE DATABASE IF NOT EXISTS ci_shadow"
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "mysql://root:ci-root@127.0.0.1:3306/ci_shadow" \
            --script --exit-code > drift.sql 2> drift.err
          code=$?
          set -e
          # GitHub truncates each annotation at about 4 KB, so long output is split.
          annotate() { awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); print }' "$1" | head -c 3900; }
          if [ "$code" = "2" ]; then
            cat drift.sql
            { echo '### Schema drift: a migration is needed'; echo '```sql'; cat drift.sql; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tables=$(grep -oE '^(ALTER TABLE|CREATE TABLE|CREATE (UNIQUE )?INDEX `[^`]+` ON|DROP INDEX `[^`]+` ON) `[^`]+`' drift.sql | grep -oE '`[^`]+`$' | tr -d '`' | sort -u | paste -sd ' ' - | head -c 2500)
            echo "::error title=Schema drift::prisma/migrations does not reproduce prisma/schema.prisma: $(grep -c ';[[:space:]]*$' drift.sql) statements. Tables: ${tables}. Full SQL follows and is in the job summary."
            split -C 3300 -d -a 2 drift.sql drift.part.
            parts=$(ls drift.part.* | wc -l); i=0
            for part in drift.part.*; do
              [ -e "$part" ] || break
              i=$((i + 1)); [ "$i" -le 8 ] || break
              echo "::error title=Schema drift SQL ${i}/${parts}::$(annotate "$part")"
            done
            exit 1
          fi
          if [ "$code" != "0" ]; then
            cat drift.err drift.sql
            echo "::error title=prisma migrate diff failed::$(cat drift.err drift.sql > drift.all; annotate drift.all)"
            exit "$code"
          fi
          echo "No drift: the migration chain reproduces prisma/schema.prisma exactly."

      # The workflow files themselves are code: a wrong action tag, a renamed
      # required job or a read-less mode switch must fail here, not on main.
      # It runs in this job (not `security-scan`) because it needs the parser
      # that ships with the installed dev dependencies.
      - name: Validate workflow files
        run: node scripts/validate-workflows.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Keep these checks separate: a failure must identify the exact suite in
      # the Actions summary instead of being flattened into one exit code.
      - name: Unit tests
        run: npm test

      - name: Deploy rollback test
        run: bash scripts/test-deploy-rollback.sh

      - name: Tenant authentication and billing integration test
        run: TSX_TSCONFIG_PATH="$PWD/tsconfig.json" node --import tsx scripts/test-tenant-workflows.ts

      - name: Reliability workflow integration test
        run: TSX_TSCONFIG_PATH="$PWD/tsconfig.json" node --import tsx scripts/test-reliability-workflows.ts

      - name: Offline media pipeline smoke test
        run: node scripts/verify-media-pipeline.mjs

      - name: Photo-video handler workflow test
        run: TSX_TSCONFIG_PATH="$PWD/tsconfig.json" node --import tsx scripts/test-photo-video-workflow.ts

      # Built without JWT_SECRET / VAULT_MASTER_KEY on purpose, like the server
      # build in scripts/deploy-production.sh: MarketingOS secrets are runtime-only
      # and must never be able to break an ALO release build.
      - name: Production build
        run: npm run build

      - name: Verify standalone output
        run: test -f .next/standalone/server.js

      # The only proof that the artefact actually boots: start the standalone
      # server, sign in, and probe the routes. It previously reported 6/13
      # because SMOKE_ADMIN_EMAIL/PASSWORD never reached the child process;
      # that is fixed, and this step keeps it fixed. SMOKE_HEALTH_EXPECT=honest
      # accepts a truthful 503 (database reachability from the child is not
      # assumed) but rejects a 500 or a fake "healthy".
      - name: Smoke the standalone server (boot, sign-in, routes)
        env:
          SMOKE_PORT: "3096"
          SMOKE_NODE_ENV: development
          SMOKE_ADMIN_EMAIL: ci-smoke@alolabs.invalid
        run: |
          # The throwaway password and the session secret are GENERATED per run:
          # a literal credential in a workflow file is a real finding for
          # scripts/scan-secrets.mjs even when it only protects a container.
          SMOKE_ADMIN_PASSWORD="$(node -e 'console.log(require("node:crypto").randomBytes(18).toString("hex"))')"
          NEXTAUTH_SECRET="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          export SMOKE_ADMIN_PASSWORD NEXTAUTH_SECRET
          # `tail -n 1` is the bare scrypt$… value; the lines above it are .env
          # instructions (the $. escapes would corrupt a direct env var).
          HASH=$(printf '%s' "$SMOKE_ADMIN_PASSWORD" | node scripts/hash-admin-password.mjs | tail -n 1)
          # SMOKE_HEALTH_EXPECT=honest: the database URL above is exported for the
          # migration steps, but whether the standalone child reaches it is not
          # assumed; a truthful 503 "unhealthy" is correct, a 500 or a fake
          # "healthy" is not. SMOKE_EXPECT_AUTH=1 requires the unauthenticated 401.
          ADMIN_EMAIL="$SMOKE_ADMIN_EMAIL" ADMIN_PASSWORD_HASH="$HASH" ADMIN_OTP_REQUIRED=false \
            SMOKE_EXPECT_AUTH=1 SMOKE_HEALTH_EXPECT=honest RELEASE_SHA="$GITHUB_SHA" \
            node scripts/verification/smoke-standalone.mjs

  security-scan:
    name: Secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Test redaction and scan candidate tree
        run: |
          node --test tests/secret-scanner.test.mjs
          node scripts/scan-secrets.mjs

      - name: Check database files are not tracked
        run: |
          if git ls-files | grep -iE "\.(db|sqlite|sqlite3)$|\.db-journal$"; then
            echo "::error::A database file is tracked in git. Remove it with git rm --cached."
            exit 1
          fi
          echo "No database files tracked"

  docker-smoke:
    name: Docker build & runtime smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: 'true'
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies and apply migrations to isolated MySQL
        run: |
          npm ci --ignore-scripts
          npx prisma migrate deploy

      - name: Build production Docker image
        run: |
          docker build --build-arg "RELEASE_SHA=$GITHUB_SHA" -t alo-learning-journey:ci-smoke .

      - name: Run container and verify runtime endpoints
        env:
          SMOKE_ADMIN_EMAIL: ci-docker-smoke@alolabs.invalid
        run: |
          SMOKE_ADMIN_PASSWORD="$(node -e 'console.log(require("node:crypto").randomBytes(18).toString("hex"))')"
          NEXTAUTH_SECRET="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          VAULT_MASTER_KEY="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          HASH="$(printf '%s' "$SMOKE_ADMIN_PASSWORD" | node scripts/hash-admin-password.mjs | tail -n 1)"

          docker run -d --name alo-ci-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3061 \
            -e HOSTNAME=0.0.0.0 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NEXTAUTH_URL=http://127.0.0.1:3061 \
            -e NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            -e VAULT_MASTER_KEY="$VAULT_MASTER_KEY" \
            -e ADMIN_EMAIL="$SMOKE_ADMIN_EMAIL" \
            -e ADMIN_PASSWORD_HASH="$HASH" \
            -e ADMIN_OTP_REQUIRED=false \
            -e RELEASE_SHA="$GITHUB_SHA" \
            alo-learning-journey:ci-smoke

          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3061/api/health >/tmp/docker-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" -eq 1 ] || { echo "::error::Docker container did not become healthy"; exit 1; }

          node - "$GITHUB_SHA" "$SMOKE_ADMIN_EMAIL" "$SMOKE_ADMIN_PASSWORD" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [expectedSha, email, password] = process.argv.slice(2);
          const origin = "http://127.0.0.1:3061";

          async function run() {
            const health = JSON.parse(fs.readFileSync("/tmp/docker-health.json", "utf8"));
            assert.ok(["healthy", "degraded"].includes(health.status), `unexpected health status: ${health.status}`);
            assert.equal(health.releaseSha, expectedSha, "releaseSha must match built commit");

            const loginRes = await fetch(`${origin}/login`);
            assert.equal(loginRes.status, 200, "GET /login must return 200");

            const unauth = await fetch(`${origin}/api/approvals`, { redirect: "manual" });
            assert.ok(unauth.status === 401 || unauth.status === 307, `unauthenticated /api/approvals returned ${unauth.status}`);

            const csrfRes = await fetch(`${origin}/api/auth/csrf`);
            const csrf = (await csrfRes.json()).csrfToken;
            const jar = (csrfRes.headers.getSetCookie?.() ?? []).map((c) => c.split(";")[0]);
            const authRes = await fetch(`${origin}/api/auth/callback/credentials`, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded", Cookie: jar.join("; ") },
              body: new URLSearchParams({ csrfToken: csrf, email, password, json: "true" }),
              redirect: "manual",
            });
            const cookies = [...(authRes.headers.getSetCookie?.() ?? []), ...jar].map((c) => c.split(";")[0]);

            const diagRes = await fetch(`${origin}/api/health/diagnose`, { headers: { Cookie: cookies.join("; ") } });
            assert.equal(diagRes.status, 200, "authenticated /api/health/diagnose must return 200");

            const wfRes = await fetch(`${origin}/api/workforce`, { headers: { Cookie: cookies.join("; ") } });
            assert.equal(wfRes.status, 200, "authenticated /api/workforce must return 200");

            console.log("Docker container runtime smoke verified:", { status: health.status, releaseSha: health.releaseSha });
          }
          run().catch((err) => { console.error(err); process.exit(1); });
          NODE

      - name: Collect container logs and cleanup
        if: always()
        run: |
          docker logs alo-ci-smoke --tail 80 || true
          docker rm -f alo-ci-smoke || true

  e2e-playwright:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CI: 'true'
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies and Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Apply migrations and build production standalone app
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Run Playwright browser E2E suite
        env:
          PLAYWRIGHT_PORT: "3097"
          PLAYWRIGHT_ADMIN_EMAIL: ci-e2e-admin@alolabs.invalid
        run: |
          PLAYWRIGHT_ADMIN_PASSWORD="$(node -e 'console.log(require("node:crypto").randomBytes(18).toString("hex"))')"
          NEXTAUTH_SECRET="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          JWT_SECRET="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          VAULT_MASTER_KEY="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          ADMIN_PASSWORD_HASH="$(printf '%s' "$PLAYWRIGHT_ADMIN_PASSWORD" | node scripts/hash-admin-password.mjs | tail -n 1)"
          export PLAYWRIGHT_ADMIN_PASSWORD NEXTAUTH_SECRET JWT_SECRET VAULT_MASTER_KEY ADMIN_PASSWORD_HASH
          export NODE_ENV=production
          export NEXTAUTH_URL=http://127.0.0.1:3097
          export ADMIN_EMAIL="$PLAYWRIGHT_ADMIN_EMAIL"
          export ADMIN_OTP_REQUIRED=false
          export MARKETINGOS_ALLOW_REGISTRATION=true
          export RELEASE_SHA="$GITHUB_SHA"
          npm run test:e2e
