name: CI

# Verified-PR gate: every pull request into main must pass this workflow, and
# deploy.yml runs it as its `verify` job (workflow_call) before any production
# step. The toolchain matches production: Node 22 + npm, with package-lock.json
# as the canonical lockfile (scripts/deploy-production.sh and cPanel both run
# `npm ci`). bun.lock is kept for local Bun users only and is not used here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# When deploy.yml calls this workflow it runs in the caller's context, so the
# group must include the workflow name; otherwise the push-triggered CI run and
# deploy's `verify` job would cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Explicitly identify this as CI so disposable-database guards don't rely
      # on runner-specific defaults. DATABASE_URL is isolated and throwaway.
      CI: 'true'
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Record candidate version (not a release tag)
        run: |
          printf 'Candidate: %s · SHA: %s · Node: %s · npm: %s\n' \
            "$(node -p 'require("./package.json").version')" "$GITHUB_SHA" "$(node -v)" "$(npm -v)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma and generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Verify the checked-in migration contract
        run: npm run verify:migrations

      - name: Apply migrations twice to isolated MySQL and verify tables/columns
        run: |
          # Print each command's output; on failure also publish its last lines as
          # an error annotation so the database error is visible on the PR itself.
          check() {
            local title="$1"; shift
            local code=0 out
            out=$("$@" 2>&1) || code=$?
            printf '%s\n' "$out"
            if [ "$code" -ne 0 ]; then
              echo "::error title=${title}::$(printf '%s\n' "$out" | grep -v '^[[:space:]]*$' | tail -n 40 | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); print }')"
              exit "$code"
            fi
          }
          check "prisma migrate deploy (first run)" npx prisma migrate deploy
          check "prisma migrate deploy (re-run must be a no-op)" npx prisma migrate deploy
          check "prisma migrate status" npx prisma migrate status
          check "migration integration test" npm run test:migrations:integration

      - name: Schema drift check (migrations must reproduce prisma/schema.prisma)
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root -e "CREATE DATABASE IF NOT EXISTS ci_shadow"
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "mysql://root:ci-root@127.0.0.1:3306/ci_shadow" \
            --script --exit-code > drift.sql 2> drift.err
          code=$?
          set -e
          # GitHub truncates each annotation at about 4 KB, so long output is split.
          annotate() { awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); print }' "$1" | head -c 3900; }
          if [ "$code" = "2" ]; then
            cat drift.sql
            { echo '### Schema drift: a migration is needed'; echo '```sql'; cat drift.sql; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tables=$(grep -oE '^(ALTER TABLE|CREATE TABLE|CREATE (UNIQUE )?INDEX `[^`]+` ON|DROP INDEX `[^`]+` ON) `[^`]+`' drift.sql | grep -oE '`[^`]+`$' | tr -d '`' | sort -u | paste -sd ' ' - | head -c 2500)
            echo "::error title=Schema drift::prisma/migrations does not reproduce prisma/schema.prisma: $(grep -c ';[[:space:]]*$' drift.sql) statements. Tables: ${tables}. Full SQL follows and is in the job summary."
            split -C 3300 -d -a 2 drift.sql drift.part.
            parts=$(ls drift.part.* | wc -l); i=0
            for part in drift.part.*; do
              [ -e "$part" ] || break
              i=$((i + 1)); [ "$i" -le 8 ] || break
              echo "::error title=Schema drift SQL ${i}/${parts}::$(annotate "$part")"
            done
            exit 1
          fi
          if [ "$code" != "0" ]; then
            cat drift.err drift.sql
            echo "::error title=prisma migrate diff failed::$(cat drift.err drift.sql > drift.all; annotate drift.all)"
            exit "$code"
          fi
          echo "No drift: the migration chain reproduces prisma/schema.prisma exactly."

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Keep these checks separate: a failure must identify the exact suite in
      # the Actions summary instead of being flattened into one exit code.
      - name: Unit tests
        run: npm test

      - name: Deploy rollback test
        run: bash scripts/test-deploy-rollback.sh

      - name: Tenant authentication and billing integration test
        run: TSX_TSCONFIG_PATH="$PWD/tsconfig.json" node --import tsx scripts/test-tenant-workflows.ts

      - name: Offline media pipeline smoke test
        run: node scripts/verify-media-pipeline.mjs

      - name: Photo-video handler workflow test
        run: TSX_TSCONFIG_PATH="$PWD/tsconfig.json" node --import tsx scripts/test-photo-video-workflow.ts

      # Built without JWT_SECRET / VAULT_MASTER_KEY on purpose, like the server
      # build in scripts/deploy-production.sh: MarketingOS secrets are runtime-only
      # and must never be able to break an ALO release build.
      - name: Production build
        run: npm run build

      - name: Verify standalone output
        run: test -f .next/standalone/server.js

  security-scan:
    name: Secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Test redaction and scan candidate tree
        run: |
          node --test tests/secret-scanner.test.mjs
          node scripts/scan-secrets.mjs

      - name: Check database files are not tracked
        run: |
          if git ls-files | grep -iE "\.(db|sqlite|sqlite3)$|\.db-journal$"; then
            echo "::error::A database file is tracked in git. Remove it with git rm --cached."
            exit 1
          fi
          echo "No database files tracked"
