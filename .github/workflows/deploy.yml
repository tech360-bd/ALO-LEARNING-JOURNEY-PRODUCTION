name: Deploy to VPS

# Intended pipeline: feature branch → PR/CI → authorized merge to main →
# Tailscale/SSH preflight → production approval → exact-SHA build → dump
# integrity check + separately rehearsed restore evidence → reviewed migration
# gate → PM2 release switch → strict local and public health checks. No stage
# in this workflow has been executed against production by the current audit.
#
# ── Network topology (operator configuration; not live-verified here) ───────
# Older audit notes describe a self-hosted Ubuntu host behind NAT and Tailscale.
# This checkout has no current VPS/network evidence. The workflow therefore
# verifies Tailscale connectivity, configured SSH port, and pinned SSH at run time; do not
# infer a host address, firewall state, proxy, or production readiness from these
# comments. SERVER_HOST must be an operator-verified tailnet destination; never
# place a public host here unless its security and routing have been reviewed.
#
# ── Deployment safety (explicit gates) ──────────────────────────────────────
#   Job `network-preflight` — connectivity tests ONLY. Never deploys, never
#   touches the running application. Can be run alone via workflow_dispatch
#   (mode=preflight-only) to produce network evidence. On push it runs only
#   when VPS_DEPLOY_ENABLED == 'true' (otherwise it and `deploy` are skipped).
#   Job `deploy` runs ONLY when ALL of the following hold:
#     1. CI `verify` job is green (same reusable workflow as PRs);
#     2. `network-preflight` is green (Tailscale auth + tailnet ACL + configured SSH port +
#        SSH public-key auth all proven on this run);
#     3. repository VARIABLE VPS_DEPLOY_ENABLED == 'true' (readiness switch —
#        keep it UNSET until the blockers in DEPLOYMENT.md §Deployment
#        blockers are cleared; unset ⇒ the deploy job is skipped);
#     4. a human approves the deployment in the `production` GitHub
#        Environment (Settings → Environments → production → Required
#        reviewers). Successful network connectivity is NOT authorization to
#        deploy.
#
# Required GitHub configuration (DEPLOYMENT.md §GitHub setup and
# deploy/tailscale/README.md). Host/path assertions below are repository
# configuration, not live-verified server evidence:
#   Secrets: SERVER_HOST (preferred) or VPS_HOST (legacy), VPS_USER,
#            VPS_SSH_KEY, VPS_SSH_HOST_KEY, VPS_PORT (optional, default 22),
#            TAILSCALE_OAUTH_CLIENT_ID, TAILSCALE_OAUTH_SECRET
#   Variables: VPS_APP_DIR=/home/alamin/alolabs-projects/ALO-LEARNING-JOURNEY-PRODUCTION,
#              VPS_PM2_APP=learn, VPS_APP_PORT=3061,
#              DEPLOY_URL=https://learn.alolabs.net, HEALTH_PATH=/api/health,
#              VPS_RESTORE_TEST_SHA + VPS_RESTORE_TEST_REFERENCE (only after an
#              isolated restore rehearsal), VPS_SCHEMA_PREFLIGHT_SHA +
#              VPS_SCHEMA_PREFLIGHT_REFERENCE (only after schema/history review),
#              VPS_MIGRATION_PLAN_SHA (only after migration rehearsal),
#              VPS_DEPLOY_ENABLED
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight-only = network tests only (no deploy). deploy = full deploy path (still requires VPS_DEPLOY_ENABLED + production approval).'
        type: choice
        options: [preflight-only, deploy]
        default: preflight-only

permissions:
  contents: read

# Never cancel a deploy mid-flight; queue runs one at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  # ── Read-only network evidence: Tailscale auth, ACL reachability, configured SSH port ──
  network-preflight:
    name: network-preflight
    # Runs when a deployment is wanted (switch on) or when a human dispatches it.
    # The JOB NAME is a contract kept for every required-status-check setting and
    # documented reference (tests/workflows.test.mjs pins it); what is new is the
    # `outputs` below, so the deploy job can be skipped instead of inheriting a
    # failure that is a configuration gap, not a code defect.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.VPS_DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      reason: ${{ steps.readiness.outputs.reason }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v7

      # ── Deployment readiness, decided by evidence instead of intent ────────
      # The failure this replaces: VPS_DEPLOY_ENABLED is 'true', the Tailscale
      # and SSH secrets are NOT configured, so every merge to main ended red in
      # "Fail closed if networking secrets are missing" while `deploy` was
      # skipped — 20 of 20 visible Deploy runs, all on 2026-11-26/27 (run
      # 45963030024 is the last). The switch says "a deployment is wanted"; it
      # never said "this repository can authenticate". This step asks the only
      # question that matters and records the answer, in one read-only run.
      #
      #   ready     = the OAuth pair, the host, and the pinned SSH material are
      #               all present ⇒ the network steps below run;
      #   not-ready = they are absent ⇒ the run is marked SKIPPED, not failed,
      #               and the job summary says exactly what to add. A merge to
      #               main then stops reporting a deployment failure that never
      #               deployed anything.
      #
      # A credential that is PRESENT but malformed still fails hard — that is a
      # misconfiguration, not an unconfigured repository.
      - name: Classify deployment readiness
        id: readiness
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          missing=""
          [ -n "$TS_CLIENT_ID" ]     || missing="$missing TAILSCALE_OAUTH_CLIENT_ID"
          [ -n "$TS_CLIENT_SECRET" ] || missing="$missing TAILSCALE_OAUTH_SECRET"
          [ -n "$SERVER_HOST" ]      || missing="$missing SERVER_HOST (or VPS_HOST)"
          [ -n "$VPS_USER" ]         || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ]      || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_SSH_HOST_KEY" ] || missing="$missing VPS_SSH_HOST_KEY"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment::credentials present — running the network preflight"
            exit 0
          fi
          # A pair that exists but is a dummy is the state this repository is
          # actually in (run 45967580663: client id 17 chars, secret 17 chars).
          # It is a configuration gap exactly like a missing secret — nothing in
          # the codebase can fix it — so it takes the same skipped path, with a
          # different reason. A real pair that Tailscale REJECTS still fails
          # later, in the join step, which is a genuine network/credential error.
          reason="missing_secrets"
          if [ -n "$TS_CLIENT_ID" ] && [ "${#TS_CLIENT_ID}" -lt 20 ]; then
            reason="placeholder_oauth_pair"
          elif [ -n "$TS_CLIENT_SECRET" ] && [ "${#TS_CLIENT_SECRET}" -lt 40 ]; then
            reason="placeholder_oauth_pair"
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment NOT attempted — tailnet credentials are not usable"
            echo ""
            echo "Reason: \`$reason\`. \`vars.VPS_DEPLOY_ENABLED\` is \`'${{ vars.VPS_DEPLOY_ENABLED }}'\` (a deployment is wanted); the credentials are not."
            echo ""
            if [ -n "$missing" ]; then
              echo "Absent repository secrets:"
              echo ""
              for name in $missing; do echo "- \`$name\`"; done
              echo ""
            fi
            if [ "$reason" = "placeholder_oauth_pair" ]; then
              echo "The Tailscale OAuth pair is present but is a placeholder (client id ${#TS_CLIENT_ID} chars, secret ${#TS_CLIENT_SECRET} chars; a real client id is 20+ and the secret 40+)."
              echo ""
            fi
            echo "Add or replace them in Settings → Secrets and variables → Actions, then dispatch this workflow with mode=deploy."
            echo "Tailscale must be an **OAuth client** (\`k…CNTRL\` + secret, scope auth_keys:write, tag:github-runner in tagOwners), never a \`tskey-\` auth key; the SSH host key must be the server's public key line."
            echo ""
            echo "This run is reported as skipped, not failed: nothing was deployed and nothing is broken."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Deployment::{reason}: $missing — skipping the network preflight instead of failing the merge"
          # The job's own verdict follows its outputs: without credentials there
          # is nothing to test, so the run is SKIPPED (neutral) — never a red
          # that reads as "the deploy broke". A manual mode=deploy still fails
          # (handled below), and a placeholder pair on a manual deploy fails too.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_MODE" = "deploy" ]; then
            echo "::error title=Deployment::mode=deploy was requested, but the tailnet credentials are not usable ($reason)."
            exit 1
          fi
          echo "::notice title=Deployment::skipping this run — configure the secrets and dispatch mode=deploy to deploy"
          echo "SKIP_JOB=1" >> "$GITHUB_ENV"

      - name: Report skipped preflight (credentials not usable)
        if: ${{ steps.readiness.outputs.ready != 'true' }}
        env:
          REASON: ${{ steps.readiness.outputs.reason }}
        run: |
          echo "Network preflight skipped ($REASON): see the job summary for exactly what to add."

      # A `::warning` annotation never changes a job's conclusion, so this step
      # is the record, not the mechanism: the job stays green (nothing broke),
      # every network step is skipped, and `deploy` is gated on the `ready`
      # output above so a green-but-skipped preflight can never authorise a
      # deployment.
      - name: Verdict — nothing to verify (credentials not usable)
        if: ${{ steps.readiness.outputs.ready != 'true' && env.SKIP_JOB == '1' }}
        run: |
          echo "::warning title=Deployment::network preflight SKIPPED — the tailnet credentials are not usable. Nothing was deployed; CI is unaffected."
          echo "preflight=skipped" >> "$GITHUB_STEP_SUMMARY"

      # Missing credentials are classified below and end the run as SKIPPED.
      # This step is the other half: credentials that are present but malformed
      # (a tskey- auth key instead of an OAuth client, a truncated pair) must
      # still fail hard, so it only runs once readiness is confirmed.
      - name: Fail closed if networking secrets are missing
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          missing=""
          # The OAuth client pair is required. Plain auth keys are deprecated by
          # Tailscale and a non-reusable key is consumed by the first join, so a
          # key that "worked once" fails every later run with "invalid key"
          # (deploy runs 45888174326 and 45889640056). Nothing here prints a
          # secret; only shapes and lengths, which cannot be replayed.
          if [ -z "$TS_CLIENT_ID" ] || [ -z "$TS_CLIENT_SECRET" ]; then
            missing="$missing TAILSCALE_OAUTH_CLIENT_ID + TAILSCALE_OAUTH_SECRET"
          else
            # A real Tailscale OAuth client id is ~20+ characters and ends in
            # CNTRL; the secret is 40+ characters. Anything shorter is a
            # placeholder, and the action's failure for it is the unhelpful
            # "invalid key" — so report the shape, never the value (run
            # 45965932281 had a 17/17-character pair and said only "too short").
            case "$TS_CLIENT_ID" in
              k*CNTRL) echo "::notice title=Tailnet::OAuth client id looks like a Tailscale client id" ;;
              tskey-*) echo "::error title=Tailnet::TAILSCALE_OAUTH_CLIENT_ID holds an auth key (tskey-…), not an OAuth client id. Create one at https://login.tailscale.com/admin/settings/oauth — do not reuse the auth key."; exit 1 ;;
              *) echo "::warning title=Tailnet::TAILSCALE_OAUTH_CLIENT_ID does not look like a client id (expected k…CNTRL, got length ${#TS_CLIENT_ID})." ;;
            esac
            if [ "${#TS_CLIENT_ID}" -lt 20 ] || [ "${#TS_CLIENT_SECRET}" -lt 40 ]; then
              echo "::error title=Tailnet::the OAuth pair is a placeholder (client id ${#TS_CLIENT_ID} chars, secret ${#TS_CLIENT_SECRET} chars; a real client id is 20+ and the secret 40+). Replace BOTH secrets with the pair from https://login.tailscale.com/admin/settings/oauth (scopes: auth_keys write; tag: tag:github-runner in tagOwners). The placeholder join fails with \"invalid key\"."
              exit 1
            fi
          fi
          if [ -n "$TS_AUTH_KEY" ]; then
            echo "::warning title=Tailnet::TAILSCALE_AUTH_KEY is set but no longer used — the workflow is OAuth-client only. Delete the secret so it cannot be mistaken for a working credential."
          fi
          [ -n "$SERVER_HOST" ]      || missing="$missing SERVER_HOST (or legacy VPS_HOST)"
          [ -n "$VPS_USER" ]         || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ]      || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_SSH_HOST_KEY" ] || missing="$missing VPS_SSH_HOST_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing — see DEPLOYMENT.md §GitHub setup and deploy/tailscale/README.md. Refusing to continue."
            exit 1
          fi

      # Pinned action: tailscale/github-action v4.4.0, pinned to its release
      # commit SHA (064b10558093f38325e838ddea35486bdc6b1d5c). Nodes created by
      # this action are ephemeral: they log out at the end of the job and are
      # removed from the tailnet automatically. The OAuth client is scoped to
      # auth_keys write + tag:github-runner only (deploy/tailscale/README.md).
      # The action performs the join itself; the next step only asserts the
      # result, because the action can swallow a failed `tailscale up`.
      - name: Tailscale connect (ephemeral tagged runner)
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          # OAuth client ONLY. Tailscale deprecated plain auth keys, and a
          # single-use key is consumed by the first successful join, so the next
          # run dies with "invalid key" (deploy runs 45888174326 and 45889640056).
          # `tags` is always supplied, so the action never reaches its
          # 'tags is required when using an OAuth client' branch. An `authkey`
          # input must not be passed at all: when both are present the action
          # warns about the deprecated key and installs no binaries
          # (tailscale-binary=MISSING in run 45889640056).
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          # A tailnet whose policy does not define the tag fails the join with
          # 'requested tags [...] are invalid or not permitted', so the tag comes
          # from a repository variable (deploy/tailscale/README.md); leave it
          # unset for an untagged ephemeral node.
          tags: ${{ vars.TAILSCALE_TAGS }}
          version: '1.104.4' # matches the pinned action's current default
          hostname: gha-learn-deploy-${{ github.run_id }}
          ping: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}

      # The action can log `invalid key: unable to validate API key` on every
      # retry and still complete, so membership is asserted explicitly. The join
      # itself is left to the pinned action: it performs the OAuth exchange that
      # Tailscale's deprecation of plain auth keys now requires.
      - name: Assert the runner joined the tailnet
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        run: |
          set -uo pipefail
          if sudo -n tailscale status >/dev/null 2>&1; then
            echo "::notice title=Tailnet::joined"
            sudo -n tailscale status | head -5
            exit 0
          fi
          echo "--- tailscale status ---"
          sudo -n tailscale status 2>&1 | head -10 || true
          echo "--- tailscaled log (tail) ---"
          sudo -n journalctl -u tailscaled -n 25 --no-pager 2>/dev/null | tail -25 || true
          echo "::error title=Tailnet::the runner is not on the tailnet. 'invalid key' means the credential is wrong/revoked/expired: set TAILSCALE_OAUTH_CLIENT_ID + TAILSCALE_OAUTH_SECRET (OAuth client with auth_keys:write and tag:github-runner in tagOwners) — plain auth keys are deprecated, and a non-REUSABLE key is consumed by the first run. 'requested tags are invalid or not permitted' means vars.TAILSCALE_TAGS is not owned in tagOwners."
          exit 1

      # The action reports only `sudo failed with exit code 1`, which hides the
      # real reason (unknown/mistagged OAuth key, ACL denial, expired client).
      # This read-only step surfaces it without exposing any secret value.
      - name: Tailscale diagnostics (read-only, safe to fail)
        if: ${{ always() && steps.readiness.outputs.ready == 'true' }}
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # Job logs are not always downloadable, but check-run annotations always
          # are, so every fact is also emitted as an annotation.
          note() { echo "::notice title=Tailscale diag::$(printf '%s' "$1" | tr '\n' ' ' | head -c 900)"; }
          echo "### Tailscale diagnostics"
          note "credential-in-use=$(if [ -n "$TS_CLIENT_ID" ] && [ -n "$TS_CLIENT_SECRET" ]; then echo 'oauth client pair (preferred)'; elif [ -n "$TS_AUTH_KEY" ]; then echo 'plain auth key — deprecated by Tailscale; a non-REUSABLE key is burned after one run'; else echo 'NONE — set TAILSCALE_OAUTH_CLIENT_ID + TAILSCALE_OAUTH_SECRET'; fi)"
          note "oauth-client-id-length=${#TS_CLIENT_ID} oauth-secret-length=${#TS_CLIENT_SECRET} auth-key-length=${#TS_AUTH_KEY}"
          note "tailscale-binary=$(command -v tailscale || echo MISSING)"
          note "sudo-non-interactive=$(sudo -n true >/dev/null 2>&1 && echo yes || echo NO)"
          echo "- OAuth client id length: ${#TS_CLIENT_ID} (must be non-zero)"
          echo "- tailscale binary: $(command -v tailscale || echo MISSING)"
          echo "- sudo non-interactive: $(sudo -n true >/dev/null 2>&1 && echo yes || echo NO)"
          echo "- tailscaled.log (last 40 lines):"
          log_tail="$(tail -n 40 "$HOME/tailscaled.log" 2>/dev/null || echo '(no log written)')"
          printf '%s\n' "$log_tail"
          # Lines are long; emit the decisive ones first, then chunk the rest so
          # nothing is truncated mid-line by the 900-character annotation limit.
          note "tailscaled.log-errors: $(printf '%s' "$log_tail" | grep -iE 'invalid key|unauthorized|denied|error|NeedsLogin|Logged out' | tail -n 4 | cut -c1-200)"
          printf '%s' "$log_tail" | tail -n 3 | while IFS= read -r line; do note "tailscaled.log: $line"; done
          echo "- tailscale status:"
          st="$(timeout 20 sudo -n tailscale status 2>&1 | head -20 || echo '(not connected)')"
          printf '%s\n' "$st"
          note "tailscale-status: $(printf '%s' "$st" | head -6)"

      - name: Tailscale status (evidence)
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        run: tailscale status || true

      - name: Configure SSH (pinned host key, key material only)
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        env:
          SERVER_PORT: ${{ secrets.VPS_PORT }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # StrictHostKeyChecking stays ON. The secret carries the server's
          # host-key LINE (any name field); we pin the key material and bind it
          # to the configured deploy host so verification works identically for
          # the tailnet IP and any alias. Hashed known_hosts lines are not
          # supported — see deploy/tailscale/README.md §Host-key pinning.
          bash scripts/write-pinned-host.sh > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::VPS_SSH_HOST_KEY is malformed (expected at least one 'host keytype key' line). Refusing to continue."
            exit 1
          fi

      - name: 'Preflight: tailnet destination + configured SSH port + SSH auth (read-only)'
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        timeout-minutes: 4
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          SERVER_PORT: ${{ secrets.VPS_PORT }}
          SERVER_USER: ${{ secrets.VPS_USER }}
          # Fail in seconds, not minutes: 4 attempts x 5s covers tailnet
          # propagation while leaving the job time to report the real cause.
          PREFLIGHT_ATTEMPTS: '4'
          PREFLIGHT_TCP_TIMEOUT: '5'
          # SSH_KEY_FILE is intentionally unset: `env:` values are not shell-expanded,
          # so "$HOME/..." would be a literal path. The script defaults to ~/.ssh/deploy_key.
        run: bash scripts/network-preflight.sh --tcp --ssh

      # Only meaningful once the runner is on the tailnet. Run 45965932281 ran
      # this while the join had been refused, and its "peers=0 / tcp:closed /
      # ssh: connect timed out" annotations read like network outages instead of
      # "we never joined, because the OAuth pair is a placeholder".
      - name: Network evidence (annotations, safe to fail)
        if: ${{ always() && steps.readiness.outputs.ready == 'true' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          SERVER_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          note() { echo "::notice title=Network::$(printf '%s' "$1" | tr '\n' ' ' | head -c 900)"; }
          if [ "${#TS_CLIENT_ID}" -lt 20 ] || [ "${#TS_CLIENT_SECRET}" -lt 40 ]; then
            note "skipped: the Tailscale OAuth pair is a placeholder (id ${#TS_CLIENT_ID} chars, secret ${#TS_CLIENT_SECRET} chars); nothing was joined, so there is no network evidence to collect"
            exit 0
          fi
          note "target=$SERVER_HOST port=${SERVER_PORT:-22}"
          note "peers=$(sudo -n tailscale status 2>/dev/null | wc -l) tailnet-host-visible=$(sudo -n tailscale status 2>/dev/null | grep -c "^$SERVER_HOST" || true)"
          note "ping: $(sudo -n tailscale ping -c 1 --timeout=5s "$SERVER_HOST" 2>&1 | head -2)"
          note "tcp:$(timeout 6 bash -c "exec 3<>/dev/tcp/$SERVER_HOST/${SERVER_PORT:-22}" 2>&1 && echo open || echo closed)"
          note "ssh:$(timeout 25 ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "${VPS_USER}@$SERVER_HOST" true 2>&1 | head -3 || true)"
        continue-on-error: true

      - name: Preflight summary
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          DEPLOY_ENABLED: ${{ vars.VPS_DEPLOY_ENABLED }}
          PREFLIGHT_READY: ${{ steps.readiness.outputs.ready }}
        run: |
          {
            echo "## Network preflight (read-only — no deploy)"
            echo "- Runner tailnet identity: gha-learn-deploy-${{ github.run_id }} (ephemeral, tag:github-runner)"
            echo "- Deploy host under test: $SERVER_HOST"
            if [ -n "$DEPLOY_ENABLED" ]; then
              echo "- Deployment readiness switch (vars.VPS_DEPLOY_ENABLED): '$DEPLOY_ENABLED'"
            if [ "${PREFLIGHT_READY:-}" != "true" ]; then
              echo "- Tailnet credentials: NOT usable — the preflight was skipped, so nothing about the network was (or could be) proven on this run."
            else
              echo "- Tailnet credentials: present — the network steps above are the evidence."
            fi
            else
              echo "- Deployment readiness switch (vars.VPS_DEPLOY_ENABLED): unset — deploy job will be SKIPPED"
            fi
            echo "- Full deployment is additionally gated on the production environment approval."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Production deploy: exact merged SHA over the tailnet ──────────────────
  deploy:
    name: deploy
    needs: [verify, network-preflight]
    # Readiness switch + explicit run mode + a preflight that actually ran.
    # Unset VPS_DEPLOY_ENABLED ⇒ skipped. On push `inputs` is empty, so it must
    # not be consulted on that path. `needs.network-preflight.outputs.ready` is
    # what stops a credentials-less run from reaching this job at all: the
    # preflight reports success with a neutral "skipped" verdict so that CI stays
    # green, but it must never be read as authorisation to deploy.
    if: ${{ github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true' && needs.network-preflight.outputs.ready == 'true' && (github.event_name == 'push' || inputs.mode == 'deploy') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Explicit production approval gate: configure required reviewers on this
    # environment (Settings → Environments → production). The job pauses until
    # an approved human reviewer authorizes the deployment.
    environment: production
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v7

      - name: Fail closed if deployment secrets are missing
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          missing=""
          # The OAuth client pair is required. Plain auth keys are deprecated by
          # Tailscale and a non-reusable key is consumed by the first join, so a
          # key that "worked once" fails every later run with "invalid key"
          # (deploy runs 45888174326 and 45889640056). Nothing here prints a
          # secret; only shapes and lengths, which cannot be replayed.
          if [ -z "$TS_CLIENT_ID" ] || [ -z "$TS_CLIENT_SECRET" ]; then
            missing="$missing TAILSCALE_OAUTH_CLIENT_ID + TAILSCALE_OAUTH_SECRET"
          else
            # A real Tailscale OAuth client id is ~20+ characters and ends in
            # CNTRL; the secret is 40+ characters. Anything shorter is a
            # placeholder, and the action's failure for it is the unhelpful
            # "invalid key" — so report the shape, never the value (run
            # 45965932281 had a 17/17-character pair and said only "too short").
            case "$TS_CLIENT_ID" in
              k*CNTRL) echo "::notice title=Tailnet::OAuth client id looks like a Tailscale client id" ;;
              tskey-*) echo "::error title=Tailnet::TAILSCALE_OAUTH_CLIENT_ID holds an auth key (tskey-…), not an OAuth client id. Create one at https://login.tailscale.com/admin/settings/oauth — do not reuse the auth key."; exit 1 ;;
              *) echo "::warning title=Tailnet::TAILSCALE_OAUTH_CLIENT_ID does not look like a client id (expected k…CNTRL, got length ${#TS_CLIENT_ID})." ;;
            esac
            if [ "${#TS_CLIENT_ID}" -lt 20 ] || [ "${#TS_CLIENT_SECRET}" -lt 40 ]; then
              echo "::error title=Tailnet::the OAuth pair is a placeholder (client id ${#TS_CLIENT_ID} chars, secret ${#TS_CLIENT_SECRET} chars; a real client id is 20+ and the secret 40+). Replace BOTH secrets with the pair from https://login.tailscale.com/admin/settings/oauth (scopes: auth_keys write; tag: tag:github-runner in tagOwners). The placeholder join fails with \"invalid key\"."
              exit 1
            fi
          fi
          if [ -n "$TS_AUTH_KEY" ]; then
            echo "::warning title=Tailnet::TAILSCALE_AUTH_KEY is set but no longer used — the workflow is OAuth-client only. Delete the secret so it cannot be mistaken for a working credential."
          fi
          [ -n "$SERVER_HOST" ]      || missing="$missing SERVER_HOST (or legacy VPS_HOST)"
          [ -n "$VPS_USER" ]         || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ]      || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_SSH_HOST_KEY" ] || missing="$missing VPS_SSH_HOST_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing — see DEPLOYMENT.md §GitHub setup. Refusing to deploy."
            exit 1
          fi

      - name: Verify production approval gate is configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The `production` environment MUST require reviewers (explicit
          # human approval before any deploy). If this API call cannot verify
          # that protection, fail closed rather than assume the gate exists.
          api="repos/${{ github.repository }}/environments/production"
          if rules="$(gh api "$api" 2>/dev/null)"; then
            if echo "$rules" | jq -e '
                 ((.protection_rules // []) | map(select((.type // "") | test("review"; "i"))) | length > 0)
                 or
                 ((.protection_rules // []) | map(.reviewers? // []) | flatten | length > 0)
               ' >/dev/null; then
              echo "production environment has required reviewers configured"
            else
              echo "::error::The 'production' GitHub Environment has NO required reviewers — that is the explicit production approval gate. Configure it (Settings -> Environments -> production -> Required reviewers) before deploying. Refusing to deploy."
              exit 1
            fi
          else
            echo "::error::Cannot verify production environment protection rules with the workflow token. Grant the required read permission or resolve the environment gate before deploying; refusing to deploy."
            exit 1
          fi

      # Install tailscaled only; the join is performed in the next step so the
      # real `tailscale up` error is visible (this action rethrows bare exit codes).
      - name: Tailscale connect (ephemeral tagged runner)
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          # OAuth client ONLY. Tailscale deprecated plain auth keys, and a
          # single-use key is consumed by the first successful join, so the next
          # run dies with "invalid key" (deploy runs 45888174326 and 45889640056).
          # `tags` is always supplied, so the action never reaches its
          # 'tags is required when using an OAuth client' branch. An `authkey`
          # input must not be passed at all: when both are present the action
          # warns about the deprecated key and installs no binaries
          # (tailscale-binary=MISSING in run 45889640056).
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          # A tailnet whose policy does not define the tag fails the join with
          # 'requested tags [...] are invalid or not permitted', so the tag comes
          # from a repository variable (deploy/tailscale/README.md); leave it
          # unset for an untagged ephemeral node.
          tags: ${{ vars.TAILSCALE_TAGS }}
          version: '1.104.4' # matches the pinned action's current default
          hostname: gha-learn-deploy-${{ github.run_id }}
          ping: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}

      - name: Assert the runner joined the tailnet
        run: |
          set -uo pipefail
          if sudo -n tailscale status >/dev/null 2>&1; then
            sudo -n tailscale status | head -5
            exit 0
          fi
          echo "--- tailscale status ---"
          sudo -n tailscale status 2>&1 | head -10 || true
          echo "::error title=Tailnet::the runner is not on the tailnet. 'invalid key' means the credential is wrong/revoked/expired or was already consumed (a non-REUSABLE auth key is single-use): configure TAILSCALE_OAUTH_CLIENT_ID + TAILSCALE_OAUTH_SECRET with auth_keys:write and tag:github-runner in tagOwners. 'requested tags are invalid or not permitted' means vars.TAILSCALE_TAGS is not owned in tagOwners."
          exit 1

      - name: Configure SSH (pinned host key, key material only)
        env:
          SERVER_PORT: ${{ secrets.VPS_PORT }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          bash scripts/write-pinned-host.sh > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::VPS_SSH_HOST_KEY is malformed (expected at least one 'host keytype key' line). Refusing to deploy."
            exit 1
          fi

      - name: 'Preflight (re-check): configured SSH port + SSH auth before deploy'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          SERVER_PORT: ${{ secrets.VPS_PORT }}
          SERVER_USER: ${{ secrets.VPS_USER }}
          # SSH_KEY_FILE is intentionally unset: `env:` values are not shell-expanded,
          # so "$HOME/..." would be a literal path. The script defaults to ~/.ssh/deploy_key.
        run: bash scripts/network-preflight.sh --tcp --ssh

      - name: Deploy exact SHA to production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          PM2_APP_NAME: ${{ vars.VPS_PM2_APP }}
          APP_PORT: ${{ vars.VPS_APP_PORT }}
          RESTORE_TEST_SHA: ${{ vars.VPS_RESTORE_TEST_SHA }}
          RESTORE_TEST_REFERENCE: ${{ vars.VPS_RESTORE_TEST_REFERENCE }}
          SCHEMA_PREFLIGHT_SHA: ${{ vars.VPS_SCHEMA_PREFLIGHT_SHA }}
          SCHEMA_PREFLIGHT_REFERENCE: ${{ vars.VPS_SCHEMA_PREFLIGHT_REFERENCE }}
          MIGRATION_PLAN_APPROVED_SHA: ${{ vars.VPS_MIGRATION_PLAN_SHA }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          HEALTH_PATH: ${{ vars.HEALTH_PATH }}
          VPS_DEPLOY_ENABLED: ${{ vars.VPS_DEPLOY_ENABLED }}
        run: |
          # These values are operator-confirmed production configuration and
          # must stay exact; no host/path/service fallback is permitted.
          [ "$APP_DIR" = "/home/alamin/alolabs-projects/ALO-LEARNING-JOURNEY-PRODUCTION" ] || { echo "::error::VPS_APP_DIR must be /home/alamin/alolabs-projects/ALO-LEARNING-JOURNEY-PRODUCTION."; exit 1; }
          [ "$PM2_APP_NAME" = "learn" ] || { echo "::error::VPS_PM2_APP must be learn (matches ecosystem.learn.config.cjs and the live PM2 process)."; exit 1; }
          [ "$APP_PORT" = "3061" ] || { echo "::error::VPS_APP_PORT must be 3061."; exit 1; }
          # Canonical production origin is learn.alolabs.net (Cloudflare Tunnel →
          # 127.0.0.1:3061). Accept either scheme; normalise to https below.
          case "$DEPLOY_URL" in
            "https://learn.alolabs.net"|"http://learn.alolabs.net"|"https://learn.alolabs.net/"|"http://learn.alolabs.net/") ;;
            *) echo "::error::DEPLOY_URL must be https://learn.alolabs.net (or http://learn.alolabs.net); got '$DEPLOY_URL'."; exit 1 ;;
          esac
          [ "$HEALTH_PATH" = "/api/health" ] || { echo "::error::Unexpected HEALTH_PATH"; exit 1; }
          [[ "$RESTORE_TEST_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::VPS_RESTORE_TEST_SHA must be a 40-character lowercase commit SHA from an isolated restore rehearsal."; exit 1; }
          [[ "$RESTORE_TEST_REFERENCE" =~ ^[A-Za-z0-9._:-]{1,80}$ ]] || { echo "::error::VPS_RESTORE_TEST_REFERENCE must identify the restore rehearsal without spaces or secrets."; exit 1; }
          [[ "$SCHEMA_PREFLIGHT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::VPS_SCHEMA_PREFLIGHT_SHA must be a 40-character SHA from schema/history review."; exit 1; }
          [ "$SCHEMA_PREFLIGHT_SHA" = "${{ github.sha }}" ] || { echo "::error::VPS_SCHEMA_PREFLIGHT_SHA must equal this exact release SHA."; exit 1; }
          [[ "$SCHEMA_PREFLIGHT_REFERENCE" =~ ^[A-Za-z0-9._:-]{1,80}$ ]] || { echo "::error::VPS_SCHEMA_PREFLIGHT_REFERENCE must identify the review without spaces or secrets."; exit 1; }
          if [ -n "$MIGRATION_PLAN_APPROVED_SHA" ] && ! [[ "$MIGRATION_PLAN_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::VPS_MIGRATION_PLAN_SHA must be a 40-character lowercase commit SHA."; exit 1
          fi
          # EXPECTED_SHA is the exact merged main commit of this run. Pending
          # migrations additionally require the independent, exact-SHA approval
          # variable documented in MIGRATION-RECOVERY-PLAN.md.
          # Public release proof is never accepted over plaintext HTTP: always
          # check TLS before the remote script can change the known-good release.
          origin="https://${DEPLOY_URL#*://}"; origin="${origin%/}"
          public_health="${origin}${HEALTH_PATH}"
          code=$(curl --connect-timeout 10 --max-time 20 -sS -o /dev/null -w '%{http_code}' "$public_health")
          [ "$code" = 200 ] || { echo "::error::Existing HTTPS health endpoint must return 200 before deployment."; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$SERVER_HOST" \
            "VPS_DEPLOY_ENABLED='$VPS_DEPLOY_ENABLED' EXPECTED_SHA='${{ github.sha }}' APP_DIR='$APP_DIR' PM2_APP_NAME='$PM2_APP_NAME' APP_PORT='$APP_PORT' HEALTH_PATH='$HEALTH_PATH' RESTORE_TEST_SHA='$RESTORE_TEST_SHA' RESTORE_TEST_REFERENCE='$RESTORE_TEST_REFERENCE' SCHEMA_PREFLIGHT_SHA='$SCHEMA_PREFLIGHT_SHA' SCHEMA_PREFLIGHT_REFERENCE='$SCHEMA_PREFLIGHT_REFERENCE' MIGRATION_PLAN_APPROVED_SHA='$MIGRATION_PLAN_APPROVED_SHA' bash -s" \
            < scripts/deploy-production.sh

      - name: Verify live site (public, via Cloudflare Tunnel / HTTPS)
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          HEALTH_PATH: ${{ vars.HEALTH_PATH }}
        run: |
          # Canonical production origin is learn.alolabs.net (Cloudflare Tunnel →
          # 127.0.0.1:3061). Accept either scheme; normalise to https below.
          case "$DEPLOY_URL" in
            "https://learn.alolabs.net"|"http://learn.alolabs.net"|"https://learn.alolabs.net/"|"http://learn.alolabs.net/") ;;
            *) echo "::error::DEPLOY_URL must be https://learn.alolabs.net (or http://learn.alolabs.net); got '$DEPLOY_URL'."; exit 1 ;;
          esac
          [ "$HEALTH_PATH" = "/api/health" ] || { echo "::error::Unexpected HEALTH_PATH"; exit 1; }
          # Accept http:// or https:// in DEPLOY_URL; the strict check is always TLS.
          base="https://${DEPLOY_URL#*://}"; base="${base%/}"
          echo "Strict public health check: $base"
          health_file="$(mktemp)"
          trap 'rm -f "$health_file"' EXIT
          code="000"; health_status=""; served_sha=""
          for i in $(seq 1 10); do
            code="$(curl --connect-timeout 10 --max-time 20 -sS -o "$health_file" -w '%{http_code}' "$base$HEALTH_PATH" || true)"
            # `healthy` = every check passed, `degraded` = optional feature
          # unconfigured (SMTP/ASR/AI provider) but the process serves fine.
          # `ok` is accepted for the pre-rename spelling.
          health_status="$(jq -r '.status // empty' "$health_file" 2>/dev/null || true)"
            served_sha="$(jq -r '.releaseSha // empty' "$health_file" 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$health_status" = "healthy" ] || [ "$health_status" = "degraded" ] || [ "$health_status" = "ok" ]; } && [ "$served_sha" = "${{ github.sha }}" ]; then break; fi
            echo "attempt $i: /api/health -> HTTP $code, status=$health_status, release=${served_sha:-unknown}; retrying in 6s"
            sleep 6
          done
          [ "$code" = "200" ] && { [ "$health_status" = "healthy" ] || [ "$health_status" = "degraded" ] || [ "$health_status" = "ok" ]; } && [ "$served_sha" = "${{ github.sha }}" ] || {
            echo "::error::Public health/release verification failed: $base$HEALTH_PATH returned HTTP $code, status=$health_status, release=${served_sha:-unknown}; expected ${{ github.sha }}"; exit 1;
          }
          root_code="$(curl --connect-timeout 10 --max-time 20 -s -o /dev/null -w '%{http_code}' "$base/" || true)"
          echo "GET $base/ -> $root_code (200 or a redirect to login is expected)"
          case "$root_code" in
            200|301|302|307|308) ;;
            *) echo "::error::Unexpected root status $root_code"; exit 1 ;;
          esac
          echo "LIVE VERIFIED: $base reports release $served_sha"

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy job (exact merged SHA)"
            printf 'Candidate package version: `%s`\n' "$(jq -er '.version' package.json)"
            echo "Expected service: ${{ vars.DEPLOY_URL }} (HTTPS 443) → PM2 on port 3061."
            echo "- Expected release SHA: \`${{ github.sha }}\`"
            echo "- Deploy job outcome: \`${{ job.status }}\`"
            echo "- Server release proof: \`current/RELEASE_SHA\` must equal the SHA above (deploy script enforces)."
          } >> "$GITHUB_STEP_SUMMARY"
